<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic OS Starter Kit</title>
<style>
  :root{--bg:#0b0e14;--card:#151a23;--line:#222a36;--txt:#e5e7eb;--muted:#9ca3af;--a1:#7c3aed;--a2:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800}
  header span{color:var(--a1)}
  #log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:75%;padding:12px 16px;border-radius:14px;font-size:.95rem;line-height:1.5;white-space:pre-wrap}
  .me{align-self:flex-end;background:var(--a2);color:#fff}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  form{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line)}
  input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:1rem}
  button{background:linear-gradient(135deg,var(--a1),var(--a2));border:0;color:#fff;font-weight:600;padding:0 20px;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<header>Agentic <span>OS</span> — Starter Kit</header>
<div id="log"></div>
<form id="f">
  <input id="i" placeholder="Type a message…" autocomplete="off" />
  <button>Send</button>
</form>
<script>
const log=document.getElementById('log'), i=document.getElementById('i'), f=document.getElementById('f');
function add(text, cls){const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight;}
add("Kit online. The brain is a placeholder — wire it to an LLM to go live.","bot");
f.onsubmit=async e=>{
  e.preventDefault();
  const v=i.value.trim(); if(!v) return;
  add(v,'me'); i.value='';
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});
    const d=await r.json();
    add(d.reply,'bot');
  }catch(err){ add("Connection error: "+err.message,'bot'); }
};
</script>
</body>
</html>
